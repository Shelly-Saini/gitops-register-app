apiVersion: apps/v1
kind: Deployment

metadata:
  name: register-app-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: register-app

  template:
    metadata:
      labels:
        app: register-app

    spec:
      containers:
      - name: register-app
        image: shelly1230897/register-app:1.0.0-14
        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "256Mi"
